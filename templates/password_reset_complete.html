<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Password Reset Complete | NovaCare Hospital</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            font-family: Arial, sans-serif;

            background: linear-gradient(
                135deg,
                #eef7ff,
                #dceeff
            );

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            width: 420px;
        }

        .hospital-name {
            text-align: center;
            margin-bottom: 25px;
        }

        .hospital-name h1 {
            margin: 0;
            color: #0d5ea8;
            font-size: 32px;
        }

        .hospital-name p {
            margin-top: 7px;
            color: #6b7c93;
            font-size: 14px;
        }

        .card {
            background: white;
            padding: 40px 38px;
            border-radius: 16px;

            text-align: center;

            box-shadow:
                0 15px 40px rgba(0, 70, 130, 0.12);
        }

        .success-icon {
            width: 65px;
            height: 65px;

            margin: 0 auto 20px;

            border-radius: 50%;

            background: #e7f3ff;

            display: flex;
            align-items: center;
            justify-content: center;

            color: #1268ad;

            font-size: 30px;
            font-weight: bold;
        }

        .card h2 {
            margin: 0 0 12px;

            color: #123f68;

            font-size: 27px;
        }

        .card p {
            color: #6f7f91;

            font-size: 14px;

            line-height: 1.6;

            margin-bottom: 28px;
        }

        .login-btn {
            display: block;

            width: 100%;

            padding: 14px;

            border-radius: 8px;

            background: #1268ad;

            color: white;

            text-decoration: none;

            font-size: 15px;

            font-weight: bold;
        }

        .login-btn:hover {
            background: #0d5792;
        }

    </style>

</head>

<body>

<div class="container">

    <div class="hospital-name">

        <h1>Aswani Hospital</h1>

        <p>
            Better Health • Brighter Tomorrow
        </p>

    </div>


    <div class="card">

        <div class="success-icon">
            ✓
        </div>

        <h2>Password Reset Complete</h2>

        <p>
            Your password has been successfully changed.
            You can now login to your NovaCare Hospital
            account using your new password.
        </p>

        <a
            href="{% url 'login' %}"
            class="login-btn"
        >
            Login
        </a>

    </div>

</div>

</body>

</html>
