<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | Aswani Hospital</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            font-family: Arial, sans-serif;

            background: linear-gradient(
                135deg,
                #eef7ff,
                #dceeff
            );

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            width: 420px;
        }

        /* Hospital Header */

        .hospital-name {
            text-align: center;
            margin-bottom: 25px;
        }

        .hospital-name h1 {
            margin: 0;
            color: #0d5ea8;
            font-size: 32px;
        }

        .hospital-name p {
            margin-top: 7px;
            color: #6b7c93;
            font-size: 14px;
        }

        /* Login Card */

        .card {
            background: white;

            padding: 38px;

            border-radius: 16px;

            box-shadow:
                0 15px 40px rgba(0, 70, 130, 0.12);
        }

        .card h2 {
            text-align: center;

            color: #123f68;

            margin-top: 0;
            margin-bottom: 8px;

            font-size: 28px;
        }

        .subtitle {
            text-align: center;

            color: #7a8a9a;

            margin-bottom: 28px;

            font-size: 14px;
        }

        /* Input */

        .input-group {
            margin-bottom: 17px;
        }

        .input-group input {
            width: 100%;

            padding: 14px 15px;

            border: 1px solid #d5e0ea;

            border-radius: 8px;

            outline: none;

            font-size: 14px;

            transition: 0.2s;
        }

        .input-group input:focus {
            border-color: #1479c9;

            box-shadow:
                0 0 0 3px rgba(20, 121, 201, 0.08);
        }

        /* Forgot Password */

        .forgot {
            margin-top: -3px;
            margin-bottom: 20px;
        }

        .forgot a {
            color: #1268ad;

            text-decoration: none;

            font-size: 13px;

            font-weight: 500;
        }

        .forgot a:hover {
            text-decoration: underline;
        }

        /* Login Button */

        .login-btn {
            width: 100%;

            padding: 14px;

            border: none;

            border-radius: 8px;

            background: #1268ad;

            color: white;

            font-size: 15px;

            font-weight: bold;

            cursor: pointer;

            transition: 0.2s;
        }

        .login-btn:hover {
            background: #0d5792;
        }

        /* Signup */

        .signup-text {
            text-align: center;

            margin-top: 22px;

            font-size: 13px;

            color: #555;
        }

        .signup-text a {
            color: #1268ad;

            text-decoration: none;

            font-weight: bold;
        }

        /* Messages */

        .messages {
            margin-bottom: 18px;
        }

        .message {
            padding: 10px 12px;

            border-radius: 7px;

            background: #fff0f0;

            color: #c0392b;

            font-size: 13px;
        }

        /* Mobile */

        @media (max-width: 500px) {

            .container {
                width: 90%;
            }

            .card {
                padding: 28px 22px;
            }

            .hospital-name h1 {
                font-size: 27px;
            }

        }

    </style>

</head>


<body>


<div class="container">


    <!-- Hospital Name -->

    <div class="hospital-name">

        <h1>Aswani Hospital</h1>

        <p>
            Better Health • Brighter Tomorrow
        </p>

    </div>


    <!-- Login Card -->

    <div class="card">

        <h2>Login</h2>

        <div class="subtitle">
            Access your account to continue
        </div>


        {% if messages %}

            <div class="messages">

                {% for message in messages %}

                    <div class="message">
                        {{ message }}
                    </div>

                {% endfor %}

            </div>

        {% endif %}


        <form method="POST">

            {% csrf_token %}


            <div class="input-group">

                <input
                    type="email"
                    name="username"
                    placeholder="Enter your email"
                    required
                >

            </div>


            <div class="input-group">

                <input
                    type="password"
                    name="password"
                    placeholder="Confirm your password"
                    required
                >

            </div>


            <div class="forgot">

                <a href="{% url 'password_reset' %}">
                    Forgot password?
                </a>

            </div>


            <button
                type="submit"
                class="login-btn"
            >
                Login
            </button>


        </form>


        <div class="signup-text">

            Don't have an account?

            <a href="{% url 'register' %}">
                Signup
            </a>

        </div>


    </div>


</div>


</body>

</html>
